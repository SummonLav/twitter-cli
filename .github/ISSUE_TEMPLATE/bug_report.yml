# Modified in the SummonLav fork; see FORK.md.
name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: "Run `/opt/twitter-safe/bin/tw --version` or `twitter --version`"
      placeholder: "e.g. 0.8.6+summonlav.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: dropdown
    id: authentication
    attributes:
      label: Authentication method
      description: "This fork does not extract browser cookies. Select the source only; never include credential values."
      options:
        - twitter-safe service account
        - Private credentials file (TWITTER_CREDENTIALS_FILE)
        - Explicit environment variables
        - No credentials configured / Other
    validations:
      required: true
  - type: dropdown
    id: access_method
    attributes:
      label: Access Method
      description: How are you accessing the machine where twitter-cli runs?
      options:
        - Local terminal
        - SSH
        - Docker / container
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: "Commands or steps to reproduce the issue. Replace credentials, authenticated proxy URLs and private content with placeholders."
      render: bash
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: "Run `/opt/twitter-safe/bin/tw -v <command>` or `twitter -v <command>`. Review and redact the output before posting; never include Cookie headers, auth_token, ct0, proxy passwords or credentials-file contents."
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Error output / logs
      description: "Paste only relevant, redacted errors. Remove credentials, proxy passwords, private posts, usernames and local paths you do not want public. Do not attach credential files."
      render: text
